spring:
  application:
    name: hui-ai-code-mother-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hui_ai_code_mother
    username: root
    password: 123456
    # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      ttl: 3600
    # session 配置
  session:
    store-type: redis
      # session 30 天过期
    timeout: 2592000
  mvc:
    async:
      # Vue SSE completion waits for dependency installation and build (up to 8 minutes).
      request-timeout: 900000
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
      # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hui.huiaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI
langchain4j:
  open-ai:
    # 聊天型模型
    chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      # 避免 Brotli 0.1.2 在 Spring 读取响应时丢失正文
      custom-headers:
        Accept-Encoding: gzip
      log-requests: true
      log-responses: true
      max-tokens: 8192
#      strict-json-schema: true
#      response-format: json_object
      max-retries: 3
      #   流式聊天型模型
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      max-tokens: 8192
      # 强制 gzip 压缩协商，规避 brotli 解压截断响应体的问题
      custom-headers:
        Accept-Encoding: gzip
      log-requests: true
      log-responses: true
      max-retries: 3
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      # 强制 gzip 压缩协商，规避 brotli 解压截断响应体的问题
      custom-headers:
        Accept-Encoding: gzip
      log-requests: true
      log-responses: true
      max-retries: 3
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-chat
      # 强制 gzip 压缩协商，规避 brotli 解压截断响应体的问题
      custom-headers:
        Accept-Encoding: gzip
      log-requests: true
      log-responses: true

# Optional image providers used by the LangGraph workflow.
pexels:
  api-key: ${PEXELS_API_KEY:}
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}

langgraph:
  workflow:
    max-generation-attempts: 3
  studio:
    enabled: false
